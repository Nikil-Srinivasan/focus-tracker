# Copy to config.toml (git-ignored) and edit. Every key is optional.

# Where screenshots, the database and logs go. Relative paths are from the repo root.
data_dir = "data"

screenshot_interval_s = 5
window_poll_s = 1
# No mouse/keyboard input for this long = idle (no screenshots, time marked idle).
idle_threshold_s = 300
jpeg_quality = 60
# Skip a screenshot when a monitor barely changed since its last saved frame.
dedupe_threshold = 2.0

# Weekly wipe of ALL screenshots. weekday: 0 = Monday ... 6 = Sunday. Local time.
wipe_weekday = 6
wipe_time = "23:59"
# Hard cap; oldest screenshot days are deleted first if exceeded.
max_storage_gb = 15

# A "day" starts at this hour, so working past midnight still counts as the same day.
day_rollover_hour = 4
ask_daily_goal = true

# Never screenshot these apps; their window titles are logged as "[excluded]".
exclude_processes = [
    "1password.exe", "bitwarden.exe", "keepass.exe", "keepassxc.exe",
    "consent.exe", "credentialuibroker.exe", "logonui.exe",
]
# Never screenshot windows whose title contains any of these (case-insensitive).
exclude_title_keywords = [
    "inprivate", "incognito", "private browsing", "netbanking", "net banking",
    "onlinesbi", "state bank of india", "yono", "icici",
    "razorpay", "paytm", "phonepe", "google pay", "payment", "checkout",
]
# No screenshots for these window titles, but the title is still logged so the
# time counts (e.g. a course site whose content must not be captured).
no_screenshot_title_keywords = ["vanakkamdsa", "vanakkam dsa"]

# ---- Phase 2: Brave extension and media ----
# Port the extension posts to (must match extension/manifest.json and background.js).
extension_port = 5610
# Browsers running the extension. A window of these whose title matches no
# reported tab is treated as a private window: title hidden, no screenshot.
extension_browsers = ["brave.exe"]
# false = store only scheme://host/path (query strings often hold tokens).
store_full_url = false
# Never screenshot, title hidden (also matches subdomains).
exclude_domains = [
    "onlinesbi.sbi", "sbi.co.in", "icicibank.com",
    "razorpay.com", "paytm.com", "phonepe.com", "pay.google.com",
]
# No screenshots, but time still counts.
no_screenshot_domains = ["lms.vanakkamdsa.com"]
# No input but sound playing (lecture, tutorial) = "watching" instead of idle.
detect_media = true

# ---- Phase 3: dashboard and prompts ----
# Dashboard at http://127.0.0.1:<port>/ (tray icon > Open dashboard).
dashboard_port = 8765
# After an idle or locked stretch of 5+ min, ask once: Thinking / Break / Call / Distracted.
ask_after_break = true
# Global hotkey that toggles a 15 min pause. Only this exact combination is
# registered; no other keys are seen or recorded. "" turns it off.
pause_hotkey = "ctrl+alt+p"

# ---- Phase 4: weekly plan ----
# The plan is saved every week at the wipe time above (Sunday 23:59), before the wipe.
# Destination for deep work per day; weekly bars ramp up +30 min from your baseline.
deep_work_goal_h = 8.0
# Minutes charged per interruption when ranking findings (refocus cost).
refocus_penalty_min = 10.0
# Also ask Claude (through your Claude Code login, claude -p, no window) to write
# a short review from the weekly numbers. Only redacted aggregates are sent.
ai_review = false
# Full path to claude.exe if it is not found automatically.
claude_path = ""
claude_timeout_s = 180

# Read text on saved screenshots (Windows OCR, local) to sort every app and site by
# what was on screen (a YouTube lecture vs a vlog) and spot goal keywords. Unsure
# pages are "Other" and listed in Settings. The text itself is never stored.
ocr = true
