<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="focus-token" content="__TOKEN__">
  <title>Focus tracker</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body>
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
      <span>Focus tracker</span>
    </div>
    <nav id="nav" aria-label="Pages">
      <a href="#today"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><rect x="7" y="13" width="4" height="4" rx="1"/></svg><span>Today</span></a>
      <a href="#focus"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg><span>Focus</span></a>
      <a href="#distractions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>Distractions</span></a>
      <a href="#replay"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/></svg><span>Replay</span></a>
      <a href="#plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg><span>Weekly plan</span></a>
      <a href="#settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>Settings</span></a>
    </nav>
    <button id="collapse" class="collapse" type="button" aria-expanded="true" aria-controls="nav">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg><span>Collapse</span>
    </button>
    <p class="side-foot">Local only. Nothing leaves this PC.</p>
  </aside>
  <div class="content">
    <header class="top">
      <h1 id="title">Today</h1>
      <div class="daypick" id="daypick">
        <button id="prev" aria-label="Previous day">&lsaquo;</button>
        <input id="day" type="date" aria-label="Day">
        <button id="next" aria-label="Next day">&rsaquo;</button>
      </div>
    </header>
    <main id="main" aria-live="polite"></main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="tip" role="tooltip" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
