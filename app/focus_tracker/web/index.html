<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="focus-token" content="__TOKEN__">
  <title>Focus tracker</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <strong class="brand">Focus tracker</strong>
    <nav id="nav">
      <a href="#today">Today</a>
      <a href="#focus">Focus</a>
      <a href="#distractions">Distractions</a>
      <a href="#replay">Replay</a>
      <a href="#settings">Settings</a>
    </nav>
    <div class="daypick">
      <button id="prev" aria-label="Previous day">&lsaquo;</button>
      <input id="day" type="date" aria-label="Day">
      <button id="next" aria-label="Next day">&rsaquo;</button>
    </div>
  </header>
  <main id="main" aria-live="polite"></main>
  <div id="tip" role="tooltip" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
