[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-tracker"
version = "0.3.0"
description = "Local-only focus tracker for Windows: activity log, screenshots, insights."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mss>=9.0",
    "Pillow>=10.0",
    "pystray>=0.19",
    "pycaw; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
focus_tracker = ["*.toml", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
